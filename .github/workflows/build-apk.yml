name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/workflows/build-local-asr.yml"
  # 手動執行：GitHub 網頁 → Actions → Build APK → Run workflow
  # （強制推送整段新歷史時不會自動觸發，需手動執行或再推一個提交）
  workflow_dispatch: {}

permissions:
  contents: write

# 同時只跑一個編譯，避免兩次推送同時發布同一版
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK (preinstalled on GitHub runners)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' $M
          # 備份存到「文件」資料夾：Android 10 需 legacy storage；大檔案需 largeHeap
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true" android:largeHeap="true"#' $M
          # 錄音前景服務：螢幕關閉或切到其他 App 時仍能收音（原生程式在 native/android/）
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' $M
          sed -i 's#</application>#    <service android:name=".RecordingService" android:exported="false" android:foregroundServiceType="microphone" />\n    </application>#' $M
          J=android/app/src/main/java/$(grep -o '"appId": *"[^"]*"' capacitor.config.json | sed 's/.*"\([^"]*\)"$/\1/' | tr . /)
          ls "$J/MainActivity.java"
          cp native/android/java/*.java "$J/"
          mkdir -p android/app/src/main/res/drawable
          cp native/android/res/drawable/*.xml android/app/src/main/res/drawable/
          grep -n "permission\|<application\|<service" $M

      # 本機語音辨識：sherpa-onnx 辨識引擎（含中文掉字修正），由 build-local-asr.yml 預先編好放在 Release「local-asr-v1」
      # 模型不放進 APK，App 內另外從同一個 Release 下載
      - name: Add sherpa-onnx library
        run: |
          mkdir -p android/app/libs
          curl -fsSL --retry 3 -o android/app/libs/sherpa-onnx.aar "https://github.com/${{ github.repository }}/releases/download/local-asr-v1/sherpa-onnx.aar"
          ls -lh android/app/libs/sherpa-onnx.aar
          unzip -l android/app/libs/sherpa-onnx.aar | grep -E "\.so$|classes.jar"
          # Google 登入（雲端硬碟同步）需要 Android 7.0（API 24）以上
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          grep -n minSdkVersion android/variables.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          dependencies {
              implementation files('libs/sherpa-onnx.aar')
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
              implementation "com.google.android.gms:play-services-auth:22.0.0"
          }
          android {
              defaultConfig {
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
          }
          GRADLE

      # 把版本號與 repo 寫進 App（版本顯示、檢查更新用）
      - name: Stamp version into web app
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          sed -i "s/__APP_VERSION__/$V/" www/index.html
          sed -i "s#__APP_REPO__#${{ github.repository }}#" www/index.html
          grep -o 'APP_\(VERSION\|REPO\)="[^"]*"' www/index.html

      - name: Generate app icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1f6f5c' --iconBackgroundColorDark '#1f6f5c'

      - name: Sync web assets and plugins
        run: npx cap sync android

      # 簽章金鑰與密碼存在 GitHub Secrets（SIGNING_KEYSTORE_BASE64、SIGNING_PASSWORD），不放在 repo 裡
      # 必須一直使用同一把金鑰，新版才能覆蓋安裝舊版（2026-10-20 已換成新金鑰）
      - name: Use fixed signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::缺少 SIGNING_KEYSTORE_BASE64 或 SIGNING_PASSWORD 這兩個 Secret（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile rootProject.file("../signing/release.keystore")
                      storePassword System.getenv("SIGNING_PASSWORD")
                      keyAlias "meetingnotes"
                      keyPassword System.getenv("SIGNING_PASSWORD")
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE

      # 版號由 VERSION 檔決定；versionCode 用執行次數，確保每次都能覆蓋安裝
      - name: Set version
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          # 失敗時把錯誤訊息寫成 annotation，方便在 Actions 摘要看到
          if ! ./gradlew assembleDebug --no-daemon > gradle.log 2>&1; then
            grep -E "error:|What went wrong|Could not|> |FAILURE|e: " gradle.log | grep -v "^> Task" | tail -40 > err.txt || true
            [ -s err.txt ] || tail -40 gradle.log > err.txt
            echo "::error title=APK build failed::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"
            exit 1
          fi
          tail -3 gradle.log

      # 檢查 APK 簽章與固定金鑰一致，不一致就讓編譯失敗
      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          # 固定金鑰的憑證指紋（公開資訊，不是金鑰本身）
          EXPECTED="22:03:74:5A:13:BC:CD:03:07:D9:36:1B:27:D3:FD:66:26:B3:61:62:B4:45:93:9B:80:41:4F:07:5D:2B:0F:E3"
          ACTUAL=$(keytool -printcert -jarfile "$APK" | grep -m1 "SHA256:" | awk '{print $2}')
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          [ -n "$EXPECTED" ] && [ "$EXPECTED" = "$ACTUAL" ]

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk meeting-notes-v${{ env.APP_VERSION }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: meeting-notes-apk
          path: meeting-notes-v${{ env.APP_VERSION }}.apk

      # 從 docs/CHANGELOG.md 取出本版的更新內容
      - name: Prepare release notes
        run: |
          {
            echo "NOTES<<EOF_NOTES"
            awk -v v="## v$APP_VERSION" 'index($0,v)==1{f=1;next} /^#+ |^---/{if(f)exit} f' docs/CHANGELOG.md | sed -e '/^[[:space:]]*$/d'
            echo "EOF_NOTES"
          } >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 會議速記 v${{ env.APP_VERSION }}
          make_latest: "true"
          body: |
            ## 本版更新
            ${{ env.NOTES }}

            ## 安裝
            1. 用手機點下方 **Assets** 裡的 `meeting-notes-v${{ env.APP_VERSION }}.apk` 下載
            2. 依提示允許「安裝未知應用程式」，直接覆蓋安裝即可，會議資料會保留
            3. 第一次使用請到左上 ☰ → 設定，依說明申請並填入 Gemini 金鑰

            已安裝 v2.0.1 以後的版本，開啟 App 就會自動更新，不需要手動下載。
            2026-10-20 換簽章金鑰之前安裝的舊版無法直接覆蓋：請先在 App 用「備份與還原」備份，移除舊 App，安裝後再還原。

            完整說明請見 [README](https://github.com/${{ github.repository }}#readme)。
          files: meeting-notes-v${{ env.APP_VERSION }}.apk
